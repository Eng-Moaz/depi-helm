apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-db
spec:
  replicas: {{ .Values.postgres.replicas }}
  selector:
    matchLabels:
      app: library-db
  template:
    metadata:
      labels:
        app: library-db
    spec:
      containers:
        - name: library-db
          image: {{ .Values.postgres.image }}:{{ .Values.postgres.tag }}
          envFrom:
            - configMapRef:
                name: library-db
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
